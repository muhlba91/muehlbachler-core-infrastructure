# Secrets for CI and local runs, read with fnox (https://fnox.jdx.dev)
#
# This is a bootstrap repository: it creates Vault, so it never reads from Vault. Its secrets live in Google Secret
# Manager in public-services-402810, named `muehlbachler-core-infrastructure--<VARIABLE>` (see BOOTSTRAP.md).
#
# - CI: Google credentials from workload identity (google-github-actions/auth); the identity is managed by
#   github-infrastructure and passed as GitHub Actions secrets (GOOGLE_CLOUD_*)
# - locally (Mac): your Application Default Credentials (`gcloud auth application-default login`); mise sets
#   FNOX_PROFILE=default here, so the machine's `dev` profile (Vault) is never used
#
# run: fnox exec -- pulumi preview --stack prod

if_missing = "error"

[providers.gsm]
type = "gcp-sm"
project = "public-services-402810"
prefix = "muehlbachler-core-infrastructure--"

[secrets]
SCW_ACCESS_KEY = { provider = "gsm", value = "SCW_ACCESS_KEY", description = "Scaleway API key of this repository's IAM application" }
SCW_SECRET_KEY = { provider = "gsm", value = "SCW_SECRET_KEY", description = "Scaleway API key of this repository's IAM application" }
HCLOUD_TOKEN = { provider = "gsm", value = "HCLOUD_TOKEN", description = "Hetzner Cloud API token" }

# plain configuration, not secret
CLOUDSDK_COMPUTE_REGION = { default = "europe-west4" }
CLOUDSDK_CORE_PROJECT = { default = "public-services-402810" }
SCW_ORGANIZATION_ID = { default = "2535e3b0-5c19-476b-8c0b-8a2a5bfac7c3" }
SCW_PROJECT_ID = { default = "d3291e99-319b-43db-9703-b67dc3e10cbb" }
SCW_DEFAULT_REGION = { default = "fr-par" }
SCW_DEFAULT_ZONE = { default = "fr-par-1" }
